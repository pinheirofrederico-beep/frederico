<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; width: 100%; border-radius: 4px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h2>Cadastro de Cliente</h2>
    
    <form id="formCadastro">
        <div>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" required>
        </div>
        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" required>
        </div>
        <button type="submit">Finalizar Cadastro</button>
    </form>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(event) {
            // 1. Evita que a página recarregue antes de processarmos os dados
            event.preventDefault();

            // 2. Captura os valores dos campos
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;

            // 3. Monta o objeto (que viraria o nosso JSON)
            const dadosCliente = {
                nome: nome,
                email: email,
                data_cadastro: new Date().toISOString()
            };

            // Simulação: Salvando no console e no localStorage
            console.log("Dados capturados:", JSON.stringify(dadosCliente));
            localStorage.setItem('clienteLogado', JSON.stringify(dadosCliente));

            // 4. O REDIRECIONAMENTO:
            // Isso leva o usuário para a nova página
            window.location.href = "livros20.html";
        });
    </script>

</body>
</html>


<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f3f4f6;
            --text: #1f2937;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            margin-bottom: 2rem;
        }

        h2 { text-align: center; color: var(--primary); }

        .form-group { margin-bottom: 1rem; }

        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Garante que o padding não quebre o layout */
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        button:hover { background-color: #4338ca; }

        /* Tabela de Dados */
        .display-area {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        th { background-color: var(--primary); color: white; }

        .id-badge {
            background: #e0e7ff;
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cadastro de Cliente</h2>
        <form id="cadastroForm">
            <div class="form-group">
                <label>Login (E-mail ou Usuário)</label>
                <input type="text" id="login" required placeholder="Ex: joao_silva">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" required placeholder="********">
            </div>
            <button type="submit">Cadastrar Cliente</button>
        </form>
    </div>

    <div class="display-area">
        <h3>Usuários Cadastrados</h3>
        <table>
            <thead>
                <tr>
                    <th>Nº Usuário</th>
                    <th>Login</th>
                    <th>Senha (Hash Simulado)</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                </tbody>
        </table>
    </div>

    <script>
        const form = document.getElementById('cadastroForm');
        const tabela = document.getElementById('tabelaCorpo');

        // Carregar dados ao iniciar
        document.addEventListener('DOMContentLoaded', exibirUsuarios);

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const login = document.getElementById('login').value;
            const senha = document.getElementById('senha').value;
            
            // Gera um número de usuário baseado no timestamp (único)
            const numUsuario = Math.floor(Math.random() * 9000) + 1000;

            const novoUsuario = { numUsuario, login, senha };

            // Salvar no LocalStorage
            let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            usuarios.push(novoUsuario);
            localStorage.setItem('usuarios', JSON.stringify(usuarios));

            form.reset();
            exibirUsuarios();
        });

        function exibirUsuarios() {
            let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            tabela.innerHTML = '';

            usuarios.forEach(user => {
                const row = `
                    <tr>
                        <td><span class="id-badge">#${user.numUsuario}</span></td>
                        <td>${user.login}</td>
                        <td>********</td> 
                    </tr>
                `;
                // Nota: Por segurança, nunca exibimos senhas reais em tabelas, 
                // mas o dado está salvo no sistema.
                tabela.innerHTML += row;
            });
        }
    </script>
</body>
</html>
