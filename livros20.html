<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Livraria Digital - Livros 2.0</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #28a745; padding-bottom: 10px; }
        .welcome-msg { font-size: 1.2em; color: #28a745; font-weight: bold; margin-bottom: 20px; }
        .book-list { list-style: none; padding: 0; }
        .book-item { background: #fff; border: 1px solid #ddd; margin-bottom: 10px; padding: 15px; border-radius: 5px; transition: transform 0.2s; }
        .book-item:hover { transform: scale(1.02); border-color: #28a745; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; float: right; }
    </style>
</head>
<body>

    <div class="container">
        <button class="logout-btn" onclick="sair()">Sair</button>
        <h1>Catálogo de Livros 2.0</h1>
        
        <p class="welcome-msg" id="mensagemBoasVindas">Carregando...</p>

        <h3>Destaques da Semana:</h3>
        <ul class="book-list">
            <li class="book-item"><strong>O Alquimista</strong> - Paulo Coelho</li>
            <li class="book-item"><strong>Dom Casmurro</strong> - Machado de Assis</li>
            <li class="book-item"><strong>1984</strong> - George Orwell</li>
            <li class="book-item"><strong>O Pequeno Príncipe</strong> - Antoine de Saint-Exupéry</li>
        </ul>
    </div>

    <script>
        // 1. Função para recuperar os dados do JSON salvo
        function carregarUsuario() {
            const dadosSalvos = localStorage.getItem('clienteLogado');

            if (dadosSalvos) {
                // Transforma a string JSON de volta em objeto
                const usuario = JSON.parse(dadosSalvos);
                
                // Exibe o nome na tela
                document.getElementById('mensagemBoasVindas').innerText = `Olá, ${usuario.nome}! Bem-vinda à sua estante virtual.`;
            } else {
                // Se não houver dados, volta para o cadastro
                alert("Por favor, faça o cadastro primeiro.");
                window.location.href = "cadastro.html"; // Ajuste o nome para o seu arquivo de cadastro
            }
        }

        function sair() {
            localStorage.removeItem('clienteLogado'); // Limpa os dados
            window.location.href = "cadastro.html"; // Volta ao início
        }

        // Executa assim que a página abre
        carregarUsuario();
    </script>

</body>
</html>
